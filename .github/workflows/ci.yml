name: Validate website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:public
      - run: npm run lint
      - run: npm test
      - run: npm run test:backend
      - run: python -m unittest discover -s tests -p 'test_deploy_scripts.py'
      - run: npm run build:static
      - run: npm audit --audit-level=high
